<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習歷程首頁</title>
    <link rel="stylesheet" href="css/myall0924.css">
    <style>
        /* 匯入日系手寫感字型 */
        @import url('https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap');
        /* 清新簡約風格設定 */
        :root {
            --bg-color: #b3f5f0;
            --card-bg: #ffffff;
            --primary-color: #4a7c59;
            --hover-color: #689f78;
            --text-color: #333333;
            --text-muted: #777777;
            --border-radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Klee One", cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .mytitle-04 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 30px;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 10px;
        }

        .mytitle-04::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        ul li {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        ul li:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        }

        ul li a {
            display: block;
            padding: 18px 24px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        ul li a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
